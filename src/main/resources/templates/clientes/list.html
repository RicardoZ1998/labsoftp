<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
</head>

<body>

<h1>Lista de Clientes</h1>

<a th:href="@{/view/clientes/form}">
    Registrar Cliente
</a>

<br><br>

<p th:if="${success}" th:text="${success}"></p>

<table border="1">

    <thead>
    <tr>
        <th>Acciones</th>
        <th>ID</th>
        <th>Nombre</th>
        <th>Documento</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Dirección</th>
        <th>Fecha Nacimiento</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="cliente : ${clientes}">

        <td>

            <a th:href="@{'/view/clientes/edit/' + ${cliente.id_cliente}}">
                Editar
            </a>

            <form th:action="@{'/view/clientes/delete/' + ${cliente.id_cliente}}"
                  method="post">

                <button type="submit">
                    Eliminar
                </button>

            </form>

        </td>

        <td th:text="${cliente.id_cliente}"></td>

        <td th:text="${cliente.nombre}"></td>

        <td th:text="${cliente.documento}"></td>

        <td th:text="${cliente.telefono}"></td>

        <td th:text="${cliente.correo}"></td>

        <td th:text="${cliente.direccion}"></td>

        <td th:text="${cliente.fecha_nacimiento}"></td>

    </tr>

    </tbody>

</table>

</body>
</html>
