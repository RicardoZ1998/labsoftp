<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Citas Médicas - Sistema de Gestión Veterinaria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header th:replace="~{fragments/navbar :: navbar('citas')}"></header>

<div class="container">

    <div class="page-title">
        <span>Citas Médicas</span>
        <a th:href="@{/citas/form}" class="btn btn-primary">+ Agendar Cita</a>
    </div>

    <!-- MENSAJES -->
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-container">
        <table class="data-table">
            <thead>
            <tr>
                <th style="width: 40px;">ID</th>
                <th style="width: 90px;">Fecha</th>
                <th>Mascota</th>
                <th>Dueño</th>
                <th>Motivo de Consulta</th>
                <th>Veterinario</th>
                <th style="width: 90px; text-align: center;">Tratamientos</th>
                <th style="width: 140px; text-align: center;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${citas}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.fecha}">2026-11-20</td>
                <td>
                    <span th:text="${c.mascota != null ? c.mascota.nombre : 'Sin asignar'}">Firulais</span>
                    <span style="color: #666666; font-size: 11px;" th:text="'(' + (${c.mascota != null ? c.mascota.especie : '-'}) + ')'">(Perro)</span>
                </td>
                <td th:text="${c.mascota != null and c.mascota.dueno != null ? c.mascota.dueno.nombre : '-'}">Ana López</td>
                <td th:text="${c.motivo}">Vacunación y chequeo</td>
                <td th:text="${c.veterinario}">Dr. Juan Pinillos</td>
                <td style="text-align: center;" th:text="${#lists.size(c.tratamientos)}">0</td>
                <td style="text-align: center;">
                    <a th:href="@{/citas/edit/{id}(id=${c.id})}" class="action-link">[Editar]</a>
                    <span> | </span>
                    <form th:action="@{/citas/delete/{id}(id=${c.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Confirma la eliminación de la cita médica?');">
                        <button type="submit" class="action-link delete">[Eliminar]</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="8" style="text-align: center; color: #777777; padding: 15px;">
                    No existen citas médicas registradas.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        Desarrollo de Software III - Universidad del Valle (Sede Tuluá)
    </div>

</div>

</body>
</html>
