<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="navbar(activeTab)">
    <div class="header-top">
        <div class="header-brand">Sistema de Gestión Veterinaria</div>
        <div class="header-user">Usuario: <strong>Administrador</strong> | Clínica Veterinaria</div>
    </div>
    <nav class="navbar">
        <a th:href="@{/}" th:classappend="${activeTab == 'inicio'} ? ' active' : ''" class="nav-link">Inicio</a>
        <a th:href="@{/mascotas}" th:classappend="${activeTab == 'mascotas'} ? ' active' : ''" class="nav-link">Mascotas</a>
        <a th:href="@{/duenos}" th:classappend="${activeTab == 'duenos'} ? ' active' : ''" class="nav-link">Dueños</a>
        <a th:href="@{/citas}" th:classappend="${activeTab == 'citas'} ? ' active' : ''" class="nav-link">Citas</a>
        <a th:href="@{/tratamientos}" th:classappend="${activeTab == 'tratamientos'} ? ' active' : ''" class="nav-link">Tratamientos</a>
    </nav>
</header>

</body>
</html>
